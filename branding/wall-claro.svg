<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <radialGradient id="glowMint" cx="0.75" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSky" cx="0.25" cy="0.65" r="0.55">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbonL1" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="ribbonL2" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="ribbonL3" x1="0" y1="0.2" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Luminous Canvas -->
  <rect width="1920" height="1080" fill="url(#bgLight)"/>
  <rect width="1920" height="1080" fill="url(#glowMint)"/>
  <rect width="1920" height="1080" fill="url(#glowSky)"/>

  <!-- Fluid macOS Ribbon Layer 1 -->
  <path d="M 0 680 C 460 520, 840 820, 1320 660 S 1780 480, 1920 540 L 1920 1080 L 0 1080 Z" fill="url(#ribbonL1)"/>
  <path d="M 0 680 C 460 520, 840 820, 1320 660 S 1780 480, 1920 540" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>

  <!-- Fluid macOS Ribbon Layer 2 -->
  <path d="M 0 780 C 400 660, 880 940, 1380 770 S 1760 620, 1920 700 L 1920 1080 L 0 1080 Z" fill="url(#ribbonL2)"/>
  <path d="M 0 780 C 400 660, 880 940, 1380 770 S 1760 620, 1920 700" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>

  <!-- Fluid macOS Ribbon Layer 3 -->
  <path d="M 0 880 C 380 790, 840 1010, 1280 880 S 1750 740, 1920 820 L 1920 1080 L 0 1080 Z" fill="url(#ribbonL3)"/>
  <path d="M 0 880 C 380 790, 840 1010, 1280 880 S 1750 740, 1920 820" fill="none" stroke="#ECFDF5" stroke-width="2.5" opacity="0.9"/>
</svg>
