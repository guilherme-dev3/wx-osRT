<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Radial Emerald Light -->
    <radialGradient id="cardGlow" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Inset Rim -->
    <linearGradient id="cardBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Modern macOS Rounded Card -->
  <rect x="2" y="2" width="596" height="296" rx="24" fill="url(#cardBg)"/>
  <rect x="2" y="2" width="596" height="296" rx="24" fill="url(#cardGlow)"/>
  <rect x="2" y="2" width="596" height="296" rx="24" fill="none" stroke="url(#cardBorder)" stroke-width="2"/>

  <!-- Logo Icon -->
  <image href="logo.png" x="45" y="75" width="150" height="150"/>

  <!-- Typography -->
  <text x="228" y="142" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">WX OS</text>
  <text x="230" y="180" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#34D399">Experiência macOS. Poder Debian.</text>
  <text x="230" y="210" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">Design limpo, fluido, rápido e em português</text>
</svg>
