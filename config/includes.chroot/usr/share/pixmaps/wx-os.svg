<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- macOS Squircle Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    
    <!-- Rich Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="55%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glass Sheen Overlay -->
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="100" ry="100" fill="url(#emeraldGrad)" filter="url(#shadow)"/>

  <!-- Top Glass Sheen -->
  <path d="M 36 136 C 36 80, 80 36, 136 36 L 376 36 C 432 36, 476 80, 476 136 L 476 220 C 340 260, 172 260, 36 220 Z" fill="url(#sheenGrad)"/>

  <!-- Inset Border (Apple 1px rim) -->
  <rect x="37" y="37" width="438" height="438" rx="99" ry="99" fill="none" stroke="url(#rimGrad)" stroke-width="2"/>

  <!-- Typography Monogram "WX" with subtle drop shadow -->
  <g filter="drop-shadow(0px 8px 12px rgba(0,25,12,0.45))">
    <!-- W Glyph -->
    <path d="M 105 175 L 150 345 L 190 345 L 225 245 L 260 345 L 300 345 L 345 175 L 310 175 L 280 290 L 245 185 L 205 185 L 170 290 L 140 175 Z" fill="#FFFFFF"/>
    <!-- X Glyph -->
    <path d="M 325 235 L 355 235 L 380 275 L 405 235 L 435 235 L 398 292 L 438 350 L 408 350 L 380 310 L 352 350 L 322 350 L 362 292 Z" fill="#DCFCE7"/>
  </g>
</svg>
